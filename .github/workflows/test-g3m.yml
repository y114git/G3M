name: Run Tests on All Platforms

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"
  G3MTOOL_BRANCH: main

jobs:
  test:
    name: Tests (${{ matrix.label }})
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux
            runs_on: ubuntu-24.04
            g3mtool_runtime: linux-x64
            g3mtool_dir: src/assets/bin/g3mtool_linux
          - label: macOS x64
            runs_on: macos-15-intel
            g3mtool_runtime: osx-x64
            g3mtool_dir: src/assets/bin/g3mtool_macos
          - label: macOS arm64
            runs_on: macos-15
            g3mtool_runtime: osx-arm64
            g3mtool_dir: src/assets/bin/g3mtool_macos
          - label: Windows
            runs_on: windows-latest
            g3mtool_runtime: win-x64
            g3mtool_dir: src/assets/bin/g3mtool_windows
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libglib2.0-dev libgl1-mesa-dev xvfb

      - name: Start virtual display
        if: runner.os == 'Linux'
        run: |
          Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
          echo "DISPLAY=:99" >> $GITHUB_ENV
          echo "QT_QPA_PLATFORM=offscreen" >> $GITHUB_ENV
          sleep 2

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -e ".[test]"

      - name: Build bundled G3MTool
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Checkout G3MTool source
        uses: actions/checkout@v7
        with:
          repository: y114git/G3MTool
          ref: ${{ env.G3MTOOL_BRANCH }}
          path: g3mtool-src
          persist-credentials: false

      - name: Publish bundled G3MTool
        shell: pwsh
        env:
          G3MTOOL_RUNTIME: ${{ matrix.g3mtool_runtime }}
          G3MTOOL_OUTPUT: ${{ matrix.g3mtool_dir }}
        run: dotnet publish g3mtool-src/G3MToolCLI -c Release -r $env:G3MTOOL_RUNTIME -o $env:G3MTOOL_OUTPUT

      - name: Build UnRAR from source
        if: runner.os != 'Windows'
        run: |
          git clone --depth 1 https://github.com/pmachapman/unrar.git unrar-src
          make -C unrar-src -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)
          mkdir -p src/assets/bin/unrar
          cp unrar-src/unrar src/assets/bin/unrar/unrar
          chmod +x src/assets/bin/unrar/unrar
          rm -rf unrar-src

      - name: Copy bundled UnRAR (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src\assets\bin\unrar | Out-Null
          Copy-Item "builds\assets\bin\UnRAR.exe" "src\assets\bin\unrar\UnRAR.exe"

      - name: Run tests
        if: runner.os != 'Windows'
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          set -o pipefail
          pytest tests/ --collect-only -q 2>&1 | tee test-collection.log || true
          pytest tests/ -v --maxfail=5 2>&1 | tee test-output.log

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          pytest tests/ --collect-only -q 2>&1 | Tee-Object -FilePath test-collection.log
          pytest tests/ -v --maxfail=5 2>&1 | Tee-Object -FilePath test-output.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish test results summary
        if: always() && runner.os != 'Windows'
        run: |
          echo "## Test Results Summary (${{ matrix.label }})" >> $GITHUB_STEP_SUMMARY
          if [ -f test-output.log ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -20 test-output.log >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Publish test results summary (Windows)
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Test Results Summary (${{ matrix.label }})"
          if (Test-Path test-output.log) {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```'
            Get-Content test-output.log -Tail 20 | Add-Content -Path $env:GITHUB_STEP_SUMMARY
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```'
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.g3mtool_runtime }}
          path: |
            .pytest_cache/
            htmlcov/
            test-output.log
            test-collection.log
          if-no-files-found: ignore
          retention-days: 7
