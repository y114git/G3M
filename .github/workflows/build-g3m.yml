name: Build and Release G3M (Linux + macOS x64 & arm64 + Windows)

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish release to GitHub? (If No, artifacts will be built but not published)"
        required: false
        type: boolean
        default: true
      version_and_tag:
        description: "Release Version and Tag (e.g., v2.0.0 or v2.0.0-beta) - Required if publishing release"
        required: false
        type: string
      release_name:
        description: "Release Name (e.g., v2.0.0 Beta) - Required if publishing release"
        required: false
        type: string
      archive_name_linux:
        description: "Archive name for Linux (e.g., G3M-Linux-v2.0.0)"
        required: false
        type: string
      archive_name_macos_x64:
        description: "Archive name for macOS x64 (e.g., G3M-macOS-x64-v2.0.0)"
        required: false
        type: string
      archive_name_macos_arm64:
        description: "Archive name for macOS arm64 (e.g., G3M-macOS-arm64-v2.0.0)"
        required: false
        type: string
      archive_name_windows:
        description: "Archive name for Windows Portable (e.g., G3M-Windows-v2.0.0)"
        required: false
        type: string
      archive_name_windows_setup:
        description: "Archive name for Windows Setup (e.g., G3M-Windows-Setup-v2.0.0)"
        required: false
        type: string

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.14"
  G3MTOOL_REPO: https://github.com/y114git/G3MTool.git
  G3MTOOL_BRANCH: main
  RELEASE_VERSION: ${{ inputs.version_and_tag || 'dev' }}
  RELEASE_TAG_FINAL: ${{ inputs.version_and_tag }}
  RELEASE_NAME_FINAL: ${{ inputs.release_name }}
  CLOUD_FUNCTIONS_BASE_URL: ${{ secrets.CLOUD_FUNCTIONS_BASE_URL }}

jobs:
  build:
    name: ${{ matrix.label }} · Build & Test
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux
            runs_on: ubuntu-22.04
            artifact_name: G3M-Linux
            g3mtool_runtime: linux-x64
            g3mtool_dir: src/assets/bin/g3mtool_linux
            startup_target: archive_content/G3M
          - label: macOS x64
            runs_on: macos-15-intel
            artifact_name: G3M-macOS-x86_64
            g3mtool_runtime: osx-x64
            g3mtool_dir: src/assets/bin/g3mtool_macos
            startup_target: G3M.app/Contents/MacOS/G3M
          - label: macOS arm64
            runs_on: macos-15
            artifact_name: G3M-macOS-arm64
            g3mtool_runtime: osx-arm64
            g3mtool_dir: src/assets/bin/g3mtool_macos
            startup_target: G3M.app/Contents/MacOS/G3M
          - label: Windows
            runs_on: windows-latest
            artifact_name: G3M-Windows
            g3mtool_runtime: win-x64
            g3mtool_dir: src/assets/bin/g3mtool_windows
            startup_target: G3M.exe
    steps:
      - uses: actions/checkout@v4

      - name: Set archive names
        id: set_names
        shell: pwsh
        run: |
          switch ('${{ matrix.label }}') {
            'Linux' {
              $archiveName = "${{ github.event.inputs.archive_name_linux }}"
              if (-not $archiveName) { $archiveName = "G3M-Linux-${{ env.RELEASE_VERSION }}" }
            }
            'macOS x64' {
              $archiveName = "${{ github.event.inputs.archive_name_macos_x64 }}"
              if (-not $archiveName) { $archiveName = "G3M-macOS-x64-${{ env.RELEASE_VERSION }}" }
            }
            'macOS arm64' {
              $archiveName = "${{ github.event.inputs.archive_name_macos_arm64 }}"
              if (-not $archiveName) { $archiveName = "G3M-macOS-arm64-${{ env.RELEASE_VERSION }}" }
            }
            'Windows' {
              $archiveName = "${{ github.event.inputs.archive_name_windows }}"
              if (-not $archiveName) { $archiveName = "G3M-Windows-${{ env.RELEASE_VERSION }}" }
              $setupName = "${{ github.event.inputs.archive_name_windows_setup }}"
              if (-not $setupName) { $setupName = "G3M-Windows-Setup-${{ env.RELEASE_VERSION }}" }
              "setup_archive_path=$($setupName).zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            }
          }
          "archive_path=$($archiveName).zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libglib2.0-dev libgl1-mesa-dev patchelf upx zip

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install upx || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install ".[build,test]"

      - name: Build G3MTool from latest source
        if: runner.os != 'Windows'
        run: |
          rm -rf g3mtool-src
          git init g3mtool-src
          git -C g3mtool-src remote add origin "${{ env.G3MTOOL_REPO }}"
          git -C g3mtool-src fetch --depth 1 origin "${{ env.G3MTOOL_BRANCH }}"
          git -C g3mtool-src checkout FETCH_HEAD
          mkdir -p "${{ matrix.g3mtool_dir }}"
          dotnet publish g3mtool-src/G3MToolCLI -c Release -r "${{ matrix.g3mtool_runtime }}" -o "${{ matrix.g3mtool_dir }}"
          rm -rf g3mtool-src

      - name: Build G3MTool from latest source (Windows)
        shell: pwsh
        run: |
          if (Test-Path g3mtool-src) { Remove-Item g3mtool-src -Recurse -Force }
          git init g3mtool-src
          git -C g3mtool-src remote add origin "${{ env.G3MTOOL_REPO }}"
          git -C g3mtool-src fetch --depth 1 origin "${{ env.G3MTOOL_BRANCH }}"
          git -C g3mtool-src checkout FETCH_HEAD
          New-Item -ItemType Directory -Force -Path "${{ matrix.g3mtool_dir }}" | Out-Null
          dotnet publish g3mtool-src/G3MToolCLI -c Release -r "${{ matrix.g3mtool_runtime }}" -o "${{ matrix.g3mtool_dir }}"
          Remove-Item g3mtool-src -Recurse -Force

      - name: Ensure G3MTool is executable
        if: runner.os != 'Windows'
        run: chmod +x "${{ matrix.g3mtool_dir }}"/* 2>/dev/null || true

      - name: Build UnRAR from source
        if: runner.os != 'Windows'
        run: |
          git clone --depth 1 https://github.com/pmachapman/unrar.git unrar-src
          make -C unrar-src -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)
          mkdir -p src/assets/bin/unrar
          cp unrar-src/unrar src/assets/bin/unrar/unrar
          chmod +x src/assets/bin/unrar/unrar
          rm -rf unrar-src

      - name: Copy bundled UnRAR (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src\assets\bin\unrar | Out-Null
          Copy-Item "builds\assets\bin\UnRAR.exe" "src\assets\bin\unrar\UnRAR.exe"

      - name: Generate .env file
        shell: pwsh
        run: |
          $envContent = "CLOUD_FUNCTIONS_BASE_URL=$env:CLOUD_FUNCTIONS_BASE_URL"
          [System.IO.File]::WriteAllText('src\.env', $envContent)

      - name: Build via spec
        run: pyinstaller -y builds/G3MExecutable.spec
        working-directory: .

      - name: Optimize Linux binary
        if: runner.os == 'Linux'
        run: |
          strip dist/G3M || true
          upx -9 dist/G3M || true

      - name: Codesign macOS app
        if: runner.os == 'macOS'
        run: codesign --force --deep --sign - "dist/G3M.app"

      - name: Create archive (Linux)
        if: runner.os == 'Linux'
        run: |
          for file in LICENSE THIRD_PARTY_NOTICES.md SECURITY.md; do
            if [ ! -f "$file" ]; then
              echo "ERROR: required release file missing: $file"
              exit 1
            fi
          done
          mkdir -p archive_content
          mv dist/G3M archive_content/
          cp LICENSE THIRD_PARTY_NOTICES.md SECURITY.md archive_content/
          zip -r "${{ steps.set_names.outputs.archive_path }}" archive_content

      - name: Create archive (macOS)
        if: runner.os == 'macOS'
        run: |
          cp LICENSE THIRD_PARTY_NOTICES.md SECURITY.md dist/
          ditto -c -k --sequesterRsrc --keepParent "dist/G3M.app" "${{ steps.set_names.outputs.archive_path }}"
          (cd dist && zip -ur "../${{ steps.set_names.outputs.archive_path }}" LICENSE THIRD_PARTY_NOTICES.md SECURITY.md)

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md, SECURITY.md -Destination dist -Force
          Compress-Archive -Path dist\* -DestinationPath "${{ steps.set_names.outputs.archive_path }}" -Force

      - name: Test startup (Unix)
        if: runner.os != 'Windows'
        env:
          ARCHIVE_PATH: ${{ steps.set_names.outputs.archive_path }}
          STARTUP_TARGET: ${{ matrix.startup_target }}
        run: python tests/test_startup.py

      - name: Test startup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ARCHIVE_PATH: ${{ steps.set_names.outputs.archive_path }}
          STARTUP_TARGET: ${{ matrix.startup_target }}
        run: python tests/test_startup.py

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ steps.set_names.outputs.archive_path }}

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup -y

      - name: Inject version into G3MWindowsInstaller.iss
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = $env:RELEASE_VERSION.TrimStart('v')
          $content = Get-Content -Path builds/G3MWindowsInstaller.iss -Raw
          $newContent = $content -replace '(?m)^(#define\s+AppVersion\s+\").*?(\")$', "`$1$ver`$2"
          $utf8NoBomEncoding = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText("$pwd\builds\G3MWindowsInstaller.iss", $newContent, $utf8NoBomEncoding)

      - name: Build installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" builds/G3MWindowsInstaller.iss

      - name: Create archive for setup exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path Output -Filter "G3M_setup_v*.exe" | Select-Object -First 1
          if (-not $exe) { Write-Error 'Installer not found'; exit 1 }
          Compress-Archive -Path $exe.FullName -DestinationPath "${{ steps.set_names.outputs.setup_archive_path }}" -Force

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: G3M-Windows-Setup
          path: ${{ steps.set_names.outputs.setup_archive_path }}

  release:
    name: Create GitHub Release and upload assets
    runs-on: ubuntu-latest
    needs: [build]
    if: ${{ inputs.publish_release != false }}
    steps:
      - name: Validate release inputs
        run: |
          if [ -z "${{ inputs.version_and_tag }}" ]; then
            echo "ERROR: version_and_tag is required when publishing release"
            exit 1
          fi
          if [ -z "${{ inputs.release_name }}" ]; then
            echo "ERROR: release_name is required when publishing release"
            exit 1
          fi
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release_assets
          merge-multiple: true

      - name: List gathered assets
        run: find ./release_assets -type f -name "*.zip" -print

      - name: Get existing release
        id: get_release
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: '${{ env.RELEASE_TAG_FINAL }}'
              });
              return release.data;
            } catch (error) {
              if (error.status === 404) return null;
              throw error;
            }

      - name: Delete existing release assets if release exists
        if: steps.get_release.outputs.result != 'null'
        uses: actions/github-script@v7
        with:
          script: |
            const release = JSON.parse('${{ steps.get_release.outputs.result }}');
            for (const asset of release.assets) {
              console.log('Deleting existing asset:', asset.name);
              await github.rest.repos.deleteReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: asset.id,
              });
            }

      - name: Create or update GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG_FINAL }}
          name: ${{ env.RELEASE_NAME_FINAL }}
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            release_assets/*.zip

