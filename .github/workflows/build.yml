name: Build and Release DELTAHUB (Linux + macOS x64 & arm64 + Windows)

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish release to GitHub? (If No, artifacts will be built but not published)"
        required: false
        type: boolean
        default: true
      version_and_tag:
        description: "Release Version and Tag (e.g., v2.0.0 or v2.0.0-beta) - Required if publishing release"
        required: false
        type: string
      release_name:
        description: "Release Name (e.g., v2.0.0 Beta) - Required if publishing release"
        required: false
        type: string
      archive_name_linux:
        description: "Archive name for Linux (e.g., DELTAHUB-Linux-v2.0.0)"
        required: false
        type: string
      archive_name_macos_x64:
        description: "Archive name for macOS x64 (e.g., DELTAHUB-macOS-x64-v2.0.0)"
        required: false
        type: string
      archive_name_macos_arm64:
        description: "Archive name for macOS arm64 (e.g., DELTAHUB-macOS-arm64-v2.0.0)"
        required: false
        type: string
      archive_name_windows:
        description: "Archive name for Windows Portable (e.g., DELTAHUB-Windows-v2.0.0)"
        required: false
        type: string
      archive_name_windows_setup:
        description: "Archive name for Windows Setup (e.g., DELTAHUB-Windows-Setup-v2.0.0)"
        required: false
        type: string

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.14"
  RELEASE_VERSION: ${{ inputs.version_and_tag || 'dev' }}
  RELEASE_TAG_FINAL: ${{ inputs.version_and_tag }}
  RELEASE_NAME_FINAL: ${{ inputs.release_name }}
  DATA_FIREBASE_URL: ${{ secrets.DATA_FIREBASE_URL }}
  CLOUD_FUNCTIONS_BASE_URL: ${{ secrets.CLOUD_FUNCTIONS_BASE_URL }}

jobs:
  build:
    name: ${{ matrix.label }} · Build & Test
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux
            runs_on: ubuntu-22.04
            artifact_name: DELTAHUB-Linux
            g3mtool_runtime: linux-x64
            g3mtool_dir: src/assets/bin/g3mtool_linux
            startup_target: archive_content/DELTAHUB
          - label: macOS x64
            runs_on: macos-15-intel
            artifact_name: DELTAHUB-macOS-x86_64
            g3mtool_runtime: osx-x64
            g3mtool_dir: src/assets/bin/g3mtool_macos
            startup_target: DELTAHUB.app/Contents/MacOS/DELTAHUB
          - label: macOS arm64
            runs_on: macos-15
            artifact_name: DELTAHUB-macOS-arm64
            g3mtool_runtime: osx-arm64
            g3mtool_dir: src/assets/bin/g3mtool_macos
            startup_target: DELTAHUB.app/Contents/MacOS/DELTAHUB
          - label: Windows
            runs_on: windows-latest
            artifact_name: DELTAHUB-Windows
            g3mtool_runtime: win-x64
            g3mtool_dir: src/assets/bin/g3mtool_windows
            startup_target: DELTAHUB.exe
    steps:
      - uses: actions/checkout@v4

      - name: Set archive names
        id: set_names
        shell: pwsh
        run: |
          switch ('${{ matrix.label }}') {
            'Linux' {
              $archiveName = "${{ github.event.inputs.archive_name_linux }}"
              if (-not $archiveName) { $archiveName = "DELTAHUB-Linux-${{ env.RELEASE_VERSION }}" }
            }
            'macOS x64' {
              $archiveName = "${{ github.event.inputs.archive_name_macos_x64 }}"
              if (-not $archiveName) { $archiveName = "DELTAHUB-macOS-x64-${{ env.RELEASE_VERSION }}" }
            }
            'macOS arm64' {
              $archiveName = "${{ github.event.inputs.archive_name_macos_arm64 }}"
              if (-not $archiveName) { $archiveName = "DELTAHUB-macOS-arm64-${{ env.RELEASE_VERSION }}" }
            }
            'Windows' {
              $archiveName = "${{ github.event.inputs.archive_name_windows }}"
              if (-not $archiveName) { $archiveName = "DELTAHUB-Windows-${{ env.RELEASE_VERSION }}" }
              $setupName = "${{ github.event.inputs.archive_name_windows_setup }}"
              if (-not $setupName) { $setupName = "DELTAHUB-Windows-Setup-${{ env.RELEASE_VERSION }}" }
              "setup_archive_path=$($setupName).zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            }
          }
          "archive_path=$($archiveName).zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libglib2.0-dev libgl1-mesa-dev patchelf upx zip

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install upx || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install ".[build]"

      - name: Build G3MTool from source
        if: runner.os != 'Windows'
        run: |
          rm -rf g3mtool-src
          git clone --depth 1 https://github.com/y114git/G3MTool.git g3mtool-src
          mkdir -p "${{ matrix.g3mtool_dir }}"
          dotnet publish g3mtool-src/G3MToolCLI -c Release -r "${{ matrix.g3mtool_runtime }}" -o "${{ matrix.g3mtool_dir }}"
          chmod +x "${{ matrix.g3mtool_dir }}"/* 2>/dev/null || true
          rm -rf g3mtool-src

      - name: Build G3MTool from source (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path g3mtool-src) { Remove-Item g3mtool-src -Recurse -Force }
          git clone --depth 1 https://github.com/y114git/G3MTool.git g3mtool-src
          New-Item -ItemType Directory -Force -Path "${{ matrix.g3mtool_dir }}" | Out-Null
          dotnet publish g3mtool-src/G3MToolCLI -c Release -r "${{ matrix.g3mtool_runtime }}" -o "${{ matrix.g3mtool_dir }}"
          Remove-Item g3mtool-src -Recurse -Force

      - name: Generate secrets_embed.py
        shell: pwsh
        run: |
          $vals = @{
            'DATA_FIREBASE_URL' = "$env:DATA_FIREBASE_URL"
            'CLOUD_FUNCTIONS_BASE_URL' = "$env:CLOUD_FUNCTIONS_BASE_URL"
          }
          $py = @('import base64', "def d(s): return base64.b64decode(s).decode('utf-8')")
          foreach ($k in $vals.Keys) {
            $b64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($vals[$k]))
            $py += "$k=d('$b64')"
          }
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllLines('secrets_embed.py', $py, $utf8NoBom)

      - name: Build via spec
        run: pyinstaller -y builds/DELTAHUB.spec

      - name: Optimize Linux binary
        if: runner.os == 'Linux'
        run: |
          strip dist/DELTAHUB || true
          upx -9 dist/DELTAHUB || true

      - name: Codesign macOS app
        if: runner.os == 'macOS'
        run: codesign --force --deep --sign - "dist/DELTAHUB.app"

      - name: Cleanup secrets
        if: always()
        shell: pwsh
        run: Remove-Item secrets_embed.py -ErrorAction SilentlyContinue

      - name: Create archive (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p archive_content
          mv dist/DELTAHUB archive_content/
          zip -r "${{ steps.set_names.outputs.archive_path }}" archive_content

      - name: Create archive (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "dist/DELTAHUB.app" "${{ steps.set_names.outputs.archive_path }}"

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\DELTAHUB.exe -DestinationPath "${{ steps.set_names.outputs.archive_path }}" -Force

      - name: Test startup (Unix)
        if: runner.os != 'Windows'
        env:
          ARCHIVE_PATH: ${{ steps.set_names.outputs.archive_path }}
          STARTUP_TARGET: ${{ matrix.startup_target }}
        run: python tests/test_startup.py

      - name: Test startup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ARCHIVE_PATH: ${{ steps.set_names.outputs.archive_path }}
          STARTUP_TARGET: ${{ matrix.startup_target }}
        run: python tests/test_startup.py

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ steps.set_names.outputs.archive_path }}

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup -y

      - name: Inject version into setup.iss
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = $env:RELEASE_VERSION.TrimStart('v')
          $content = Get-Content -Path builds/setup.iss -Raw
          $newContent = $content -replace '(?m)^(#define\s+AppVersion\s+\").*?(\")$', "`$1$ver`$2"
          $utf8NoBomEncoding = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText("$pwd\builds\setup.iss", $newContent, $utf8NoBomEncoding)

      - name: Build installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" builds/setup.iss

      - name: Create archive for setup exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path Output -Filter "DELTAHUB_setup_v*.exe" | Select-Object -First 1
          if (-not $exe) { Write-Error 'Installer not found'; exit 1 }
          Compress-Archive -Path $exe.FullName -DestinationPath "${{ steps.set_names.outputs.setup_archive_path }}" -Force

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: DELTAHUB-Windows-Setup
          path: ${{ steps.set_names.outputs.setup_archive_path }}

  release:
    name: Create GitHub Release and upload assets
    runs-on: ubuntu-latest
    needs: [build]
    if: ${{ inputs.publish_release != false }}
    steps:
      - name: Validate release inputs
        run: |
          if [ -z "${{ inputs.version_and_tag }}" ]; then
            echo "ERROR: version_and_tag is required when publishing release"
            exit 1
          fi
          if [ -z "${{ inputs.release_name }}" ]; then
            echo "ERROR: release_name is required when publishing release"
            exit 1
          fi
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release_assets
          merge-multiple: true

      - name: List gathered assets
        run: find ./release_assets -type f -name "*.zip" -print

      - name: Get existing release
        id: get_release
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: '${{ env.RELEASE_TAG_FINAL }}'
              });
              return release.data;
            } catch (error) {
              if (error.status === 404) return null;
              throw error;
            }

      - name: Delete existing release assets if release exists
        if: steps.get_release.outputs.result != 'null'
        uses: actions/github-script@v7
        with:
          script: |
            const release = JSON.parse('${{ steps.get_release.outputs.result }}');
            for (const asset of release.assets) {
              console.log('Deleting existing asset:', asset.name);
              await github.rest.repos.deleteReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: asset.id,
              });
            }

      - name: Create or update GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG_FINAL }}
          name: ${{ env.RELEASE_NAME_FINAL }}
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            release_assets/*.zip
