name: Build and Release DELTAHUB (Linux + macOS x64 & arm64 + Windows)

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish release to GitHub? (If No, artifacts will be built but not published)"
        required: false
        type: boolean
        default: true
      version_and_tag:
        description: "Release Version and Tag (e.g., v2.0.0 or v2.0.0-beta) - Required if publishing release"
        required: false
        type: string
      release_name:
        description: "Release Name (e.g., v2.0.0 Beta) - Required if publishing release"
        required: false
        type: string
      archive_name_linux:
        description: "Archive name for Linux (e.g., DELTAHUB-Linux-v2.0.0)"
        required: false
        type: string
      archive_name_macos_x64:
        description: "Archive name for macOS x64 (e.g., DELTAHUB-macOS-x64-v2.0.0)"
        required: false
        type: string
      archive_name_macos_arm64:
        description: "Archive name for macOS arm64 (e.g., DELTAHUB-macOS-arm64-v2.0.0)"
        required: false
        type: string
      archive_name_windows:
        description: "Archive name for Windows Portable (e.g., DELTAHUB-Windows-v2.0.0)"
        required: false
        type: string
      archive_name_windows_setup:
        description: "Archive name for Windows Setup (e.g., DELTAHUB-Windows-Setup-v2.0.0)"
        required: false
        type: string

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"
  PUBLISH_RELEASE: ${{ inputs.publish_release != false }}
  RELEASE_VERSION: ${{ inputs.version_and_tag || 'dev' }}
  RELEASE_TAG_FINAL: ${{ inputs.version_and_tag }}
  RELEASE_NAME_FINAL: ${{ inputs.release_name }}
  DATA_FIREBASE_URL: ${{ secrets.DATA_FIREBASE_URL }}
  CLOUD_FUNCTIONS_BASE_URL: ${{ secrets.CLOUD_FUNCTIONS_BASE_URL }}
  INTERNAL_SALT: ${{ secrets.INTERNAL_SALT }}

jobs:
  linux:
    name: Linux · onefile (spec)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set Archive Name
        id: set_names
        run: |
          archive_name="${{ github.event.inputs.archive_name_linux || format('DELTAHUB-Linux-{0}', env.RELEASE_VERSION) }}"
          echo "archive_path=${archive_name}.zip" >> $GITHUB_OUTPUT
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libglib2.0-dev libgl1-mesa-dev patchelf upx zip
      - name: Install .NET runtime
        run: |
          wget https://dot.net/v1/dotnet-install.sh -O dotnet-install.sh
          chmod +x dotnet-install.sh
          ./dotnet-install.sh --channel 8.0 --runtime dotnet --install-dir $HOME/.dotnet
          echo "$HOME/.dotnet" >> $GITHUB_PATH
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install pip deps
        run: |
          python -m pip install -U pip wheel
          pip install -r builds/requirements.txt pyinstaller
      - name: Download and extract UTMTCLI for Linux
        run: |
          mkdir -p src/assets/bin/utmtcli_linux
          curl -L -o utmtcli_linux.zip "https://github.com/UnderminersTeam/UndertaleModTool/releases/download/bleeding-edge/CLI-ubuntu-latest-Debug-isBundled-true.zip"
          unzip -q utmtcli_linux.zip -d src/assets/bin/utmtcli_linux
          rm utmtcli_linux.zip
          chmod +x src/assets/bin/utmtcli_linux/* 2>/dev/null || true
      - name: Generate secrets_embed.py
        run: |
          python - <<'PY'
          import os, base64
          def e(v): return base64.b64encode(v.encode('utf-8')).decode('ascii')
          vals = {'DATA_FIREBASE_URL':os.environ.get('DATA_FIREBASE_URL',''),'CLOUD_FUNCTIONS_BASE_URL':os.environ.get('CLOUD_FUNCTIONS_BASE_URL',''),'INTERNAL_SALT':os.environ.get('INTERNAL_SALT','')}
          with open('secrets_embed.py','w',encoding='utf-8') as f:
            f.write('import base64\n'); f.write("def d(s): return base64.b64decode(s).decode('utf-8')\n")
            for k,v in vals.items(): f.write(f"{k}=d('{e(v)}')\n")
          PY
      - name: Build via spec
        run: |
          pyinstaller -y builds/DELTAHUB.spec
          strip dist/DELTAHUB || true
          upx -9 dist/DELTAHUB || true
      - name: Cleanup secrets
        if: always()
        run: rm -f secrets_embed.py || true
      - name: Create archive
        run: |
          mkdir -p archive_content
          mv dist/DELTAHUB archive_content/
          zip -r ${{ steps.set_names.outputs.archive_path }} archive_content
      - uses: actions/upload-artifact@v4
        with:
          name: DELTAHUB-Linux
          path: ${{ steps.set_names.outputs.archive_path }}

  test-startup-linux:
    name: Test Startup (Linux)
    runs-on: ubuntu-22.04
    needs: linux
    steps:
      - uses: actions/checkout@v4
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: DELTAHUB-Linux
          path: ./test_artifacts
      - name: Extract and test startup
        run: |
          cd test_artifacts
          unzip -q *.zip || true
          if [ -f archive_content/DELTAHUB ]; then
            chmod +x archive_content/DELTAHUB
            echo "=== Testing startup ==="
            OUTPUT=$(timeout 10 ./archive_content/DELTAHUB --help 2>&1 || true)
            echo "$OUTPUT"
            if echo "$OUTPUT" | grep -q "STARTUP ERROR"; then
              echo ""
              echo "=== STARTUP ERROR DETECTED ==="
              echo "Full error output:"
              echo "$OUTPUT"
              echo ""
              echo "=== Attempting to get more details ==="
              ./archive_content/DELTAHUB --help 2>&1 || true
              echo ""
              echo "=== File information ==="
              file archive_content/DELTAHUB || true
              ldd archive_content/DELTAHUB 2>&1 | head -20 || true
              exit 1
            fi
            echo "✓ Startup test passed"
          else
            echo "ERROR: DELTAHUB executable not found in archive"
            ls -la archive_content/ || true
            exit 1
          fi

  macos-x64:
    name: macOS · x86_64 (spec)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Set Archive Name
        id: set_names
        run: |
          archive_name="${{ github.event.inputs.archive_name_macos_x64 || format('DELTAHUB-macOS-x64-{0}', env.RELEASE_VERSION) }}"
          echo "archive_path=${archive_name}.zip" >> $GITHUB_OUTPUT
      - name: Extra tools
        run: brew install upx || true
      - name: Check .NET runtime
        run: dotnet --version || echo ".NET not found, but continuing..."
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install pip deps
        run: |
          python -m pip install -U pip wheel
          pip install -r builds/requirements.txt pyinstaller
      - name: Download and extract UTMTCLI for macOS x64
        run: |
          mkdir -p src/assets/bin/utmtcli_macos
          curl -L -o utmtcli_macos.zip "https://github.com/UnderminersTeam/UndertaleModTool/releases/download/bleeding-edge/CLI-macOS-latest-Debug-isBundled-true.zip"
          unzip -q utmtcli_macos.zip -d src/assets/bin/utmtcli_macos
          rm utmtcli_macos.zip
          chmod +x src/assets/bin/utmtcli_macos/* 2>/dev/null || true
      - name: Generate secrets_embed.py
        run: |
          python - <<'PY'
          import os, base64
          def e(v): return base64.b64encode(v.encode('utf-8')).decode('ascii')
          vals = {'DATA_FIREBASE_URL':os.environ.get('DATA_FIREBASE_URL',''),'CLOUD_FUNCTIONS_BASE_URL':os.environ.get('CLOUD_FUNCTIONS_BASE_URL',''),'INTERNAL_SALT':os.environ.get('INTERNAL_SALT','')}
          with open('secrets_embed.py','w',encoding='utf-8') as f:
            f.write('import base64\n'); f.write("def d(s): return base64.b64decode(s).decode('utf-8')\n")
            for k,v in vals.items(): f.write(f"{k}=d('{e(v)}')\n")
          PY
      - name: Build via spec (x86_64)
        run: pyinstaller -y builds/DELTAHUB.spec
      - name: Codesign (adhoc)
        run: codesign --force --deep --sign - "dist/DELTAHUB.app"
      - name: Cleanup secrets
        if: always()
        run: rm -f secrets_embed.py || true
      - name: Create archive
        run: ditto -c -k --sequesterRsrc --keepParent "dist/DELTAHUB.app" "${{ steps.set_names.outputs.archive_path }}"
      - uses: actions/upload-artifact@v4
        with:
          name: DELTAHUB-macOS-x86_64
          path: ${{ steps.set_names.outputs.archive_path }}

  test-startup-macos-x64:
    name: Test Startup (macOS x64)
    runs-on: macos-15-intel
    needs: macos-x64
    steps:
      - uses: actions/checkout@v4
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: DELTAHUB-macOS-x86_64
          path: ./test_artifacts
      - name: Extract and test startup
        run: |
          cd test_artifacts
          unzip -q *.zip || true
          if [ -d DELTAHUB.app ]; then
            echo "=== Testing startup ==="
            OUTPUT=$(timeout 10 DELTAHUB.app/Contents/MacOS/DELTAHUB --help 2>&1 || true)
            echo "$OUTPUT"
            if echo "$OUTPUT" | grep -q "STARTUP ERROR"; then
              echo ""
              echo "=== STARTUP ERROR DETECTED ==="
              echo "Full error output:"
              echo "$OUTPUT"
              echo ""
              echo "=== Attempting to get more details ==="
              DELTAHUB.app/Contents/MacOS/DELTAHUB --help 2>&1 || true
              echo ""
              echo "=== File information ==="
              file DELTAHUB.app/Contents/MacOS/DELTAHUB || true
              otool -L DELTAHUB.app/Contents/MacOS/DELTAHUB 2>&1 | head -20 || true
              exit 1
            fi
            echo "✓ Startup test passed"
          else
            echo "ERROR: DELTAHUB.app not found in archive"
            ls -la || true
            exit 1
          fi

  macos-arm64:
    name: macOS · arm64 (spec)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Set Archive Name
        id: set_names
        run: |
          archive_name="${{ github.event.inputs.archive_name_macos_arm64 || format('DELTAHUB-macOS-arm64-{0}', env.RELEASE_VERSION) }}"
          echo "archive_path=${archive_name}.zip" >> $GITHUB_OUTPUT
      - name: Extra tools
        run: brew install upx || true
      - name: Check .NET runtime
        run: dotnet --version || echo ".NET not found, but continuing..."
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install pip deps
        run: |
          python -m pip install -U pip wheel
          pip install -r builds/requirements.txt pyinstaller
      - name: Download and extract UTMTCLI for macOS arm64
        run: |
          mkdir -p src/assets/bin/utmtcli_macos
          curl -L -o utmtcli_macos.zip "https://github.com/UnderminersTeam/UndertaleModTool/releases/download/bleeding-edge/CLI-macOS-latest-Debug-isBundled-true.zip"
          unzip -q utmtcli_macos.zip -d src/assets/bin/utmtcli_macos
          rm utmtcli_macos.zip
          chmod +x src/assets/bin/utmtcli_macos/* 2>/dev/null || true
      - name: Generate secrets_embed.py
        run: |
          python - <<'PY'
          import os, base64
          def e(v): return base64.b64encode(v.encode('utf-8')).decode('ascii')
          vals = {'DATA_FIREBASE_URL':os.environ.get('DATA_FIREBASE_URL',''),'CLOUD_FUNCTIONS_BASE_URL':os.environ.get('CLOUD_FUNCTIONS_BASE_URL',''),'INTERNAL_SALT':os.environ.get('INTERNAL_SALT','')}
          with open('secrets_embed.py','w',encoding='utf-8') as f:
            f.write('import base64\n'); f.write("def d(s): return base64.b64decode(s).decode('utf-8')\n")
            for k,v in vals.items(): f.write(f"{k}=d('{e(v)}')\n")
          PY
      - name: Build via spec (arm64)
        run: pyinstaller -y builds/DELTAHUB.spec
      - name: Codesign (adhoc)
        run: codesign --force --deep --sign - "dist/DELTAHUB.app"
      - name: Cleanup secrets
        if: always()
        run: rm -f secrets_embed.py || true
      - name: Create archive
        run: ditto -c -k --sequesterRsrc --keepParent "dist/DELTAHUB.app" "${{ steps.set_names.outputs.archive_path }}"
      - uses: actions/upload-artifact@v4
        with:
          name: DELTAHUB-macOS-arm64
          path: ${{ steps.set_names.outputs.archive_path }}

  test-startup-macos-arm64:
    name: Test Startup (macOS arm64)
    runs-on: macos-15
    needs: macos-arm64
    steps:
      - uses: actions/checkout@v4
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: DELTAHUB-macOS-arm64
          path: ./test_artifacts
      - name: Extract and test startup
        run: |
          cd test_artifacts
          unzip -q *.zip || true
          if [ -d DELTAHUB.app ]; then
            echo "=== Testing startup ==="
            OUTPUT=$(timeout 10 DELTAHUB.app/Contents/MacOS/DELTAHUB --help 2>&1 || true)
            echo "$OUTPUT"
            if echo "$OUTPUT" | grep -q "STARTUP ERROR"; then
              echo ""
              echo "=== STARTUP ERROR DETECTED ==="
              echo "Full error output:"
              echo "$OUTPUT"
              echo ""
              echo "=== Attempting to get more details ==="
              DELTAHUB.app/Contents/MacOS/DELTAHUB --help 2>&1 || true
              echo ""
              echo "=== File information ==="
              file DELTAHUB.app/Contents/MacOS/DELTAHUB || true
              otool -L DELTAHUB.app/Contents/MacOS/DELTAHUB 2>&1 | head -20 || true
              exit 1
            fi
            echo "✓ Startup test passed"
          else
            echo "ERROR: DELTAHUB.app not found in archive"
            ls -la || true
            exit 1
          fi

  windows:
    name: Windows · exe (spec + Inno)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set Archive Names
        id: set_names
        shell: powershell
        run: |
          $archiveName = "${{ github.event.inputs.archive_name_windows }}"
          if (-not $archiveName) { $archiveName = "DELTAHUB-Windows-${{ env.RELEASE_VERSION }}" }
          "archive_path=$($archiveName).zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          $setupName = "${{ github.event.inputs.archive_name_windows_setup }}"
          if (-not $setupName) { $setupName = "DELTAHUB-Windows-Setup-${{ env.RELEASE_VERSION }}" }
          "setup_archive_path=$($setupName).zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install pip deps
        run: |
          python -m pip install -U pip wheel
          pip install -r builds/requirements.txt pyinstaller
      - name: Download and extract UTMTCLI for Windows
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "src\assets\bin\utmtcli_windows" | Out-Null
          $zipPath = "utmtcli_windows.zip"
          Invoke-WebRequest -Uri "https://github.com/UnderminersTeam/UndertaleModTool/releases/download/bleeding-edge/CLI-windows-latest-Debug-isBundled-true.zip" -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath "src\assets\bin\utmtcli_windows" -Force
          Remove-Item $zipPath
      - name: Generate secrets_embed.py
        shell: powershell
        run: |
          $vals = @{'DATA_FIREBASE_URL'="$env:DATA_FIREBASE_URL";'CLOUD_FUNCTIONS_BASE_URL'="$env:CLOUD_FUNCTIONS_BASE_URL";'INTERNAL_SALT'="$env:INTERNAL_SALT"}
          $py = @('import base64', "def d(s): return base64.b64decode(s).decode('utf-8')")
          foreach ($k in $vals.Keys) { $b64=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($vals[$k])); $py += "$k=d('$b64')"}
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false); [System.IO.File]::WriteAllLines('secrets_embed.py',$py,$utf8NoBom)
      - name: Build via spec
        run: pyinstaller -y builds/DELTAHUB.spec
      - name: Create archive for portable exe
        shell: powershell
        run: Compress-Archive -Path dist\DELTAHUB.exe -DestinationPath "${{ steps.set_names.outputs.archive_path }}"
      - uses: actions/upload-artifact@v4
        with:
          name: DELTAHUB-Windows
          path: ${{ steps.set_names.outputs.archive_path }}

      - name: Install Inno Setup
        run: choco install innosetup -y
      - name: Inject version into setup.iss
        shell: powershell
        run: |
          $ver = $env:RELEASE_VERSION.TrimStart('v')
          $content = Get-Content -Path builds/setup.iss -Raw
          $newContent = $content -replace '(?m)^(#define\s+AppVersion\s+\").*?(\")$', "`$1$ver`$2"
          $utf8NoBomEncoding = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText("$pwd\builds\setup.iss", $newContent, $utf8NoBomEncoding)
          Write-Host "AppVersion successfully set to $ver in setup.iss"
      - name: Build installer (Inno Setup)
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" builds/setup.iss
      - name: Create archive for setup exe
        shell: powershell
        run: |
          $exe = Get-ChildItem -Path "Output" -Filter "DELTAHUB_setup_v*.exe" | Select-Object -First 1
          if (-not $exe) { Write-Error "Installer not found"; exit 1 }
          Compress-Archive -Path $exe.FullName -DestinationPath "${{ steps.set_names.outputs.setup_archive_path }}"
      - uses: actions/upload-artifact@v4
        with:
          name: DELTAHUB-Windows-Setup
          path: ${{ steps.set_names.outputs.setup_archive_path }}

  test-startup-windows:
    name: Test Startup (Windows)
    runs-on: windows-latest
    needs: windows
    steps:
      - uses: actions/checkout@v4
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: DELTAHUB-Windows
          path: ./test_artifacts
      - name: Extract and test startup
        shell: powershell
        run: |
          cd test_artifacts
          Expand-Archive -Path *.zip -DestinationPath . -Force
          if (Test-Path 'DELTAHUB.exe') {
            Write-Host '=== Testing startup ==='
            $output = & .\DELTAHUB.exe --help 2>&1
            Write-Host $output
            if ($output -match 'STARTUP ERROR') {
              Write-Host ''
              Write-Host '=== STARTUP ERROR DETECTED ==='
              Write-Host 'Full error output:'
              Write-Host $output
              Write-Host ''
              Write-Host '=== Attempting to get more details ==='
              & .\DELTAHUB.exe --help 2>&1
              Write-Host ''
              Write-Host '=== File information ==='
              Get-Item .\DELTAHUB.exe | Select-Object FullName, Length, LastWriteTime
              exit 1
            }
            Write-Host '✓ Startup test passed'
          } else {
            Write-Host 'ERROR: DELTAHUB.exe not found in archive'
            Get-ChildItem -Recurse | Select-Object FullName
            exit 1
          }

  release:
    name: Create GitHub Release and upload assets
    runs-on: ubuntu-latest
    needs:
      [
        linux,
        macos-x64,
        macos-arm64,
        windows,
        test-startup-linux,
        test-startup-macos-x64,
        test-startup-macos-arm64,
        test-startup-windows,
      ]
    if: ${{ inputs.publish_release != false }}
    steps:
      - name: Validate release inputs
        run: |
          if [ -z "${{ inputs.version_and_tag }}" ]; then
            echo "ERROR: version_and_tag is required when publishing release"
            exit 1
          fi
          if [ -z "${{ inputs.release_name }}" ]; then
            echo "ERROR: release_name is required when publishing release"
            exit 1
          fi
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release_assets
          merge-multiple: true

      - name: List gathered assets
        run: find ./release_assets -type f -name "*.zip" -print

      - name: Get existing release
        id: get_release
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: '${{ env.RELEASE_TAG_FINAL }}'
              });
              return release.data;
            } catch (error) {
              if (error.status === 404) return null;
              throw error;
            }

      - name: Delete existing release assets if release exists
        if: steps.get_release.outputs.result != 'null'
        uses: actions/github-script@v7
        with:
          script: |
            const release = JSON.parse('${{ steps.get_release.outputs.result }}');
            for (const asset of release.assets) {
              console.log('Deleting existing asset:', asset.name);
              await github.rest.repos.deleteReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: asset.id,
              });
            }

      - name: Create or update GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG_FINAL }}
          name: ${{ env.RELEASE_NAME_FINAL }}
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            release_assets/*.zip
