name: Run Tests on All Platforms

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"
  G3MTOOL_CACHE_VERSION: "1"

jobs:
  test:
    name: Tests (${{ matrix.label }})
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux
            runs_on: ubuntu-22.04
            g3mtool_archive: g3mtool-linux-x64.zip
            g3mtool_dir: src/assets/bin/g3mtool_linux
            g3mtool_cache: g3mtool-linux-x64
          - label: macOS x64
            runs_on: macos-15-intel
            g3mtool_archive: g3mtool-osx-x64.zip
            g3mtool_dir: src/assets/bin/g3mtool_macos
            g3mtool_cache: g3mtool-macos-x64
          - label: macOS arm64
            runs_on: macos-15
            g3mtool_archive: g3mtool-osx-arm64.zip
            g3mtool_dir: src/assets/bin/g3mtool_macos
            g3mtool_cache: g3mtool-macos-arm64
          - label: Windows
            runs_on: windows-latest
            g3mtool_archive: g3mtool-win-x64.zip
            g3mtool_dir: src/assets/bin/g3mtool_windows
            g3mtool_cache: g3mtool-windows-x64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libglib2.0-dev libgl1-mesa-dev xvfb

      - name: Start virtual display
        if: runner.os == 'Linux'
        run: |
          Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
          echo "DISPLAY=:99" >> $GITHUB_ENV
          echo "QT_QPA_PLATFORM=offscreen" >> $GITHUB_ENV
          sleep 2

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -e ".[test]"

      - name: Restore cached G3MTool
        id: cache-g3mtool
        uses: actions/cache@v4
        with:
          path: ${{ matrix.g3mtool_dir }}
          key: ${{ runner.os }}-${{ matrix.g3mtool_cache }}-${{ env.G3MTOOL_CACHE_VERSION }}

      - name: Download G3MTool
        if: steps.cache-g3mtool.outputs.cache-hit != 'true' && runner.os != 'Windows'
        run: |
          mkdir -p "${{ matrix.g3mtool_dir }}"
          curl -L -o g3mtool.zip "https://github.com/y114git/G3MTool/releases/latest/download/${{ matrix.g3mtool_archive }}"
          unzip -q g3mtool.zip -d "${{ matrix.g3mtool_dir }}"
          rm -f g3mtool.zip
          chmod +x "${{ matrix.g3mtool_dir }}"/* 2>/dev/null || true

      - name: Download G3MTool (Windows)
        if: steps.cache-g3mtool.outputs.cache-hit != 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${{ matrix.g3mtool_dir }}" | Out-Null
          Invoke-WebRequest -Uri "https://github.com/y114git/G3MTool/releases/latest/download/${{ matrix.g3mtool_archive }}" -OutFile g3mtool.zip
          Expand-Archive -Path g3mtool.zip -DestinationPath "${{ matrix.g3mtool_dir }}" -Force
          Remove-Item g3mtool.zip

      - name: Run tests
        if: runner.os != 'Windows'
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          set -o pipefail
          pytest tests/ --collect-only -q 2>&1 | tee test-collection.log || true
          pytest tests/ -v --maxfail=5 --html=test-report.html --self-contained-html 2>&1 | tee test-output.log

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          pytest tests/ --collect-only -q 2>&1 | Tee-Object -FilePath test-collection.log
          pytest tests/ -v --maxfail=5 --html=test-report.html --self-contained-html 2>&1 | Tee-Object -FilePath test-output.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish test results summary
        if: always() && runner.os != 'Windows'
        run: |
          echo "## Test Results Summary (${{ matrix.label }})" >> $GITHUB_STEP_SUMMARY
          if [ -f test-output.log ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -20 test-output.log >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Publish test results summary (Windows)
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Test Results Summary (${{ matrix.label }})"
          if (Test-Path test-output.log) {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```'
            Get-Content test-output.log -Tail 20 | Add-Content -Path $env:GITHUB_STEP_SUMMARY
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```'
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.g3mtool_cache }}
          path: |
            .pytest_cache/
            htmlcov/
            test-report.html
            test-output.log
            test-collection.log
          if-no-files-found: ignore
          retention-days: 7
