[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "G3M"
version = "3.3.0"
description = "G3M - GameMaker Mod Manager"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "GPL-3.0" }
authors = [{ name = "Y114" }]
dependencies = [
    "PyQt6==6.7.1",
    "defusedxml==0.7.1",
    "playsound3==3.3.1",
    "psutil==7.2.2",
    "py7zr==1.1.3",
    "python-dotenv==1.2.2",
    "rarfile==4.2",
    "requests==2.34.2",
    "urllib3==2.7.0",
]

[project.optional-dependencies]
build = ["pyinstaller==6.21.0"]
test = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-html==4.2.0",
    "pytest-mock==3.15.1",
    "pytest-qt==4.5.0",
    "responses==0.26.1",
]
dev = ["ruff==0.15.18"]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.pytest.ini_options]
minversion = "7.4"
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-ra", "--tb=short"]
usefixtures = ["sandbox_user_data_paths", "cleanup_threads"]
markers = [
    "skip_user_data_override: allow tests to use native path resolution instead of sandboxed user data root",
]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
skip_covered = true
show_missing = true

[tool.ruff]
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "T10", # flake8-debugger
    "T20", # flake8-print
    "SIM", # flake8-simplify
    "I",   # isort
    "N",   # pep8-naming
    "S",   # flake8-bandit (security)
    "A",   # flake8-builtins
    "RUF", # Ruff-specific rules
    "ANN", # flake8-annotations (type hints)
    "PT",  # pytest style
]
ignore = [
    "E501",   # line too long
    "ANN001", # missing type annotation for function argument
    "ANN002", # missing type annotation for *args
    "ANN003", # missing type annotation for **kwargs
    "ANN201", # missing return type annotation for public function
    "ANN202", # missing return type annotation for private function
    "ANN401", # dynamically typed expressions (Any, Type) are disallowed
    "S603",   # subprocess call: check for execution of untrusted input
    "S607",   # starting a process with a shell: possible security issue
    "PT001",  # use @pytest.fixture without parentheses
    "PT011",  # pytest.raises() should be called outside of the with block
    "PT012",  # pytest.raises() should not be used as a context manager
    "PT018",  # assertion should be broken down into multiple parts
    "SIM108", # use ternary operator instead of if-else-block
    "RUF012", # mutable class attributes should be annotated with `typing.ClassVar`
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "B011",
    "S101",   # use of assert detected
    "S301",   # suspicious pickle usage
    "S311",   # standard pseudo-random generators are not suitable for cryptographic purposes
    "ANN201", # missing return type annotation for public function
    "ANN202", # missing return type annotation for private function
]
"src/ui/**/*.py" = [
    "ANN201", # missing return type annotation for public function
    "ANN202", # missing return type annotation for private function
]
"tools/**/*.py" = [
    "S112", # inspection tools intentionally skip unreadable inputs
    "T201", # command-line tools write their reports to stdout
]

[tool.pyright]
include = ["src", "tools"]
exclude = [".venv", "build", "dist", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "basic"
# PyQt's generated stubs cannot model dynamic QObject attributes and expose
# override parameter names such as a0/a1 that are irrelevant at runtime.
reportAttributeAccessIssue = false
reportIncompatibleMethodOverride = false
reportOptionalMemberAccess = false

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint.pep8-naming]
ignore-names = [
    "changeEvent",
    "closeEvent",
    "dragEnterEvent",
    "dragMoveEvent",
    "dropEvent",
    "eventFilter",
    "focusOutEvent",
    "keyPressEvent",
    "leaveEvent",
    "minimumSizeHint",
    "mouseDoubleClickEvent",
    "mouseMoveEvent",
    "mousePressEvent",
    "moveEvent",
    "paintEvent",
    "resizeEvent",
    "sizeHint",
    "visit_AsyncFunctionDef",
    "wheelEvent",
]

