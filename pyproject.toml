[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deltahub"
version = "2.4.7"
description = "G3M - GameMaker Mod Manager"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "GPL-3.0" }
authors = [{ name = "Y114" }]
dependencies = [
    "PyQt6==6.7.1",
    "playsound3==3.3.1",
    "psutil==7.2.2",
    "py7zr==1.1.0",
    "python-dotenv==1.2.2",
    "rarfile==4.2",
    "requests==2.32.5",
    "urllib3==2.6.3",
]

[project.optional-dependencies]
build = ["pyinstaller==6.19.0"]
test = [
    "pytest==9.0.2",
    "pytest-cov==7.0.0",
    "pytest-html==4.2.0",
    "pytest-mock==3.15.1",
    "pytest-qt==4.5.0",
    "responses==0.26.0",
]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
namespaces = true
where = ["src"]
include = [
    "adapters*",
    "config*",
    "controllers*",
    "core*",
    "models*",
    "services*",
    "ui*",
    "utils*",
    "workers*",
]

[tool.pytest.ini_options]
minversion = "7.4"
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-ra", "--tb=short"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
skip_covered = true
show_missing = true

[tool.ruff]
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]
